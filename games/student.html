<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: url('https://i.imgur.com/hMwf59X.jpeg');
            --wolf-img: url('https://i.imgur.com/IfpJ13m.png');
            --wolf-size: 63%;
            --wolf-y: 52%;
            --egg-size: 135px;
            --egg-z: 20;
            --btn-bg: #323232;
            --btn-up-y: 41.3%;
            --btn-up-x: 89.0%;
            --btn-down-y: 7.8%;
            --btn-down-x: 88.7%;
            --rail-img: none;
            --rail-w: 33%;
            --rail-h: 14px;
            --rail-angle: 15deg;
            --rail-top-y: 4%;
            --rail-bot-y: 59%;
            --rail-x: -40%;
            
            --q-font: 'Fredoka', sans-serif;
            --q-size: 28px;
            --q-color: #333333;
            --a-font: 'Fredoka', sans-serif;
            --a-size: 20px;
            --a-color: #ffffff;
            
            --fb-font: 'Fredoka', sans-serif;
            --fb-size: 26px;
            --fb-color: #4d96a9;
            
            --ui-font: 'Fredoka', sans-serif;
            --ui-size: 20px;
            --ui-color: #333333;
            --ui-y: 3%;
            --ui-align: center;

            --egg-top-y: 12%;
            --egg-bot-y: 67%;
            --egg-x: 73%;
            --egg-angle: 50deg;
            
            --egg-final-top-y: 27%;
            --egg-final-bot-y: 53%;
            --egg-final-x: 50%;
        }
        
        body, html { 
            margin:0; padding:0; width:100%; height:100%; overflow:hidden; 
            font-family:'Fredoka', sans-serif; user-select: none; touch-action: none; 
            position: fixed; top: 0; left: 0; 
            background-color: #111; display: flex; align-items: center; justify-content: center;
        }
        
        #game-area { 
            position: relative; width: 100vw; height: 56.25vw; 
            max-height: 100vh; max-width: calc(100vh * (16 / 9)); 
            background: var(--bg) center/100% 100% no-repeat; box-shadow: 0 0 20px rgba(0,0,0,0.8); overflow: hidden;
        }
        
        .rail { position: absolute; width: var(--rail-w); height: var(--rail-h); background-image: var(--rail-img); background-size: 100% 100%; background-color: #A0522D; border: 3px solid #5C3317; border-radius: 10px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.4); z-index: 4; }
        .rail-tl { top: var(--rail-top-y); left: var(--rail-x); transform: rotate(var(--rail-angle)); transform-origin: left center; }
        .rail-tr { top: var(--rail-top-y); right: var(--rail-x); transform: rotate(calc(-1 * var(--rail-angle))); transform-origin: right center; }
        .rail-bl { top: var(--rail-bot-y); left: var(--rail-x); transform: rotate(var(--rail-angle)); transform-origin: left center; }
        .rail-br { top: var(--rail-bot-y); right: var(--rail-x); transform: rotate(calc(-1 * var(--rail-angle))); transform-origin: right center; }

        .wolf-container { position:absolute; width:var(--wolf-size); left:50%; top:var(--wolf-y); transform:translate(-50%,-50%); transition: all 0.15s ease-out; z-index:10; }
        .wolf-img { width:100%; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3)); transition: transform 0.1s; }
        .mirror { transform: scaleX(-1); }

        .egg { position:absolute; width:var(--egg-size); z-index:var(--egg-z); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); transition: transform linear; }
        
        .ghost-egg { position: absolute; width: var(--egg-size); opacity: 0.5; pointer-events: none; z-index: calc(var(--egg-z) - 5); border-radius: 50%; box-shadow: 0 0 10px 4px rgba(255, 107, 157, 0.8); border: 2px dashed #FF6B9D; transform: rotate(var(--egg-angle)); transition: top 0.2s, left 0.2s, right 0.2s, width 0.2s, transform 0.2s; }
        .end-ghost { border: 2px dashed #6BCB77 !important; opacity: 0.3 !important; box-shadow: 0 0 10px 4px rgba(107, 203, 119, 0.8); }

        .ctrl { position:absolute; width:70px; height:70px; background:var(--btn-bg); border:3px solid #fff; border-radius:50%; cursor:pointer; z-index:100; color:white; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:bold; box-shadow: 0 5px 15px rgba(0,0,0,0.4); touch-action: none; user-select: none; transition: 0.1s; }
        .ctrl:active { transform: scale(0.95); }

        .btn-tl { top: var(--btn-up-y); left: var(--btn-up-x); }
        .btn-tr { top: var(--btn-up-y); right: var(--btn-up-x); }
        .btn-bl { bottom: var(--btn-down-y); left: var(--btn-down-x); }
        .btn-br { bottom: var(--btn-down-y); right: var(--btn-down-x); }

        #top-ui { position:absolute; top:var(--ui-y); left: 0; width:100%; display:flex; justify-content:var(--ui-align); gap: 15px; z-index:100; pointer-events: none; padding: 0 20px; box-sizing: border-box; }
        .stat-badge { background:rgba(255,255,255,0.95); padding:10px 15px; border-radius:15px; border:3px solid #FF6B9D; font-weight:700; font-size:var(--ui-size); font-family:var(--ui-font); color: var(--ui-color); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .stop-btn { background: #FF6B9D; color: white; border: 2px solid white; padding: 8px 15px; border-radius: 15px; font-family: var(--ui-font); font-size: var(--ui-size); font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.2s; pointer-events: auto; }
        .stop-btn:active { transform: scale(0.9); }

        #miss-sign { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:100px; color:red; display:none; z-index:2000; text-shadow: 2px 2px 10px black; }

        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:1000; color:white; text-align:center; flex-direction: column; }
        
        .menu-card { background:rgba(255,255,255,0.95); color:#333; padding:25px 35px; border-radius:25px; border:6px solid #FF6B9D; max-width:500px; width:90%; box-shadow: 0 15px 40px rgba(0,0,0,0.6); max-height: 95vh; overflow-y: auto; }
        
        .big-btn { width:100%; padding:18px; background:linear-gradient(135deg, #6BCB77 0%, #4D96A9 100%); color:white; border:none; border-radius:15px; font-size:22px; font-weight:bold; cursor:pointer; margin-top: 15px; box-shadow: 0 6px 12px rgba(0,0,0,0.3); transition: 0.2s; }
        .big-btn:hover { transform: translateY(-2px); }
        
        #countdown { font-size: 140px; color: #FFD93D; text-shadow: 0 0 30px #FF6B9D; display:none; font-weight: 900; }
        
        #q-text { font-size: var(--q-size); font-family: var(--q-font); color: var(--q-color); margin-bottom: 25px; line-height: 1.3; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; }

        .ans-btn { background: #6BCB77; border: none; padding: 15px 18px; border-radius: 12px; color: var(--a-color); font-size: var(--a-size); font-family: var(--a-font); font-weight: bold; width: 100%; margin-bottom: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.2); white-space: normal; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.2; height: auto; min-height: 50px; }
        .ans-btn:hover { transform: scale(1.02); }

        .stats-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin: 15px 0; font-size: 16px; text-align:left; font-weight: 600;}
        
        #fb-slogan { font-family: var(--fb-font); font-size: var(--fb-size); color: var(--fb-color); margin-top: 10px; margin-bottom: 5px; font-weight: bold; text-align: center; }
        
        .qr-wrapper { display: flex; flex-direction: column; align-items: center; margin: 10px 0; }
        .qr-wrapper img { width: 130px; height: 130px; border: 4px solid #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); background: #fff; }
        .qr-wrapper span { font-size: 12px; font-weight: bold; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="game-area">
        <div id="top-ui" style="display: none;">
            <div class="stat-badge">SCORE: <span id="score-val">0</span></div>
            <div class="stat-badge">TIME: <span id="timer-val">0</span></div>
            <button class="stop-btn" onclick="stopGameEarly()" style="pointer-events: auto;">⏹ STOP</button>
        </div>
        
        <div class="rail rail-tl"></div>
        <div class="rail rail-tr"></div>
        <div class="rail rail-bl"></div>
        <div class="rail rail-br"></div>

        <div class="wolf-container" id="wolf">
            <img src="https://i.imgur.com/IfpJ13m.png" class="wolf-img" id="wolf-sprite">
        </div>

        

        <div class="ctrl btn-tl" onmousedown="move('tl')" ontouchstart="move('tl')">↖</div>
        <div class="ctrl btn-tr" onmousedown="move('tr')" ontouchstart="move('tr')">↗</div>
        <div class="ctrl btn-bl" onmousedown="move('bl')" ontouchstart="move('bl')">↙</div>
        <div class="ctrl btn-br" onmousedown="move('br')" ontouchstart="move('br')">↘</div>
        
        <div id="miss-sign">❌</div>
    </div>

    <div id="screen-in-game-tasks" class="overlay" style="display:none; z-index: 3000;">
        <div class="menu-card" style="text-align: left; border-color: #4D96A9;">
            <h2 style="color:#4D96A9; text-align:center; font-size: 28px; margin-bottom: 15px;">⚙️ Настройка заданий</h2>
            
            <label style="font-weight:bold; font-size:14px; color:#333;">Вопросы (каждый с новой строки):</label>
            <textarea id="ig-tasks" style="width:100%; height:80px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc; padding:8px; font-family:inherit;"></textarea>
            
            <label style="font-weight:bold; font-size:14px; color:#6BCB77;">Верные ответы (по порядку):</label>
            <textarea id="ig-correct" style="width:100%; height:80px; margin-bottom:10px; border-radius:8px; border:1px solid #6BCB77; padding:8px; font-family:inherit;"></textarea>
            
            <label style="font-weight:bold; font-size:14px; color:#FF6B9D;">Неверные (через запятую):</label>
            <textarea id="ig-wrong" style="width:100%; height:80px; margin-bottom:15px; border-radius:8px; border:1px solid #FF6B9D; padding:8px; font-family:inherit;"></textarea>
            
            <button class="big-btn" style="background:#4D96A9;" onclick="saveIgTasks()">✅ Сохранить и продолжить</button>
        </div>
    </div>

    <div id="screen-start" class="overlay" style="">
        <div class="menu-card">
            <h2 style="color:#FF6B9D; font-size:36px; margin-bottom:10px; text-shadow: 2px 2px 0px #FFD93D;">Help the student to be smarter!</h2>
            <p style="margin-bottom:20px; font-size:18px; font-weight:600;">Use the buttons!</p>
            
            

            <button class="big-btn" onclick="preStart(window.gameConfig.speed, 1)">EASY</button>
            <button class="big-btn" style="background:linear-gradient(135deg, #FF6B9D 0%, #FFD93D 100%);" onclick="preStart(Math.max(1000, window.gameConfig.speed - 1000), 2)">HARD</button>
        </div>
    </div>

    <div id="screen-countdown" class="overlay" style="display:none">
        <div id="countdown">3</div>
    </div>

    <div id="q-modal" class="overlay" style="display:none; z-index: 2000; background: rgba(0,0,0,0.9);">
        <div class="menu-card" style="border-color: #6BCB77;">
            <div style="background: #E8F5E9; color: #6BCB77; padding: 10px 20px; border-radius: 15px; font-size: 32px; font-weight: 900; margin-bottom: 20px; border: 4px solid #6BCB77; display: inline-block;">
                ⏱ <span id="q-timer-display">60</span>
            </div>
            <h2 id="q-text">Вопрос</h2>
            <div id="answers" style="display:flex; flex-direction:column; width: 100%;"></div>
        </div>
    </div>

    <div id="screen-result" class="overlay" style="display:none">
        <div class="menu-card">
            <h2 style="color:#FF6B9D; font-size:32px; margin:0; text-shadow: 2px 2px 0px #FFD93D;">GAME OVER!</h2>
            <div style="font-size:45px; margin:10px 0;">
                🏆
            </div>
            <div class="stats-grid">
                <div>SCORE: <b id="f-score" style="color:#6BCB77;">0</b></div>
                <div>TIME: <b id="f-time" style="color:#FFD93D;">0</b>s</div>
                <div>MISSES: <b id="f-miss" style="color:#FF6B9D;">0</b></div>
            </div>
            
            <div class="qr-wrapper">
                <img id="qr-code-img" src="" alt="QR Code">
                <span>Show this QR code to the teacher</span>
            </div>

            <div id="fb-slogan">Great!!</div>
            
            <button class="big-btn" style="background:linear-gradient(135deg, #FFD93D 0%, #FF6B9D 100%); color:#333;" onclick="restartGame()">🔄 RETRY</button>
        </div>
    </div>

    <audio id="snd-success" src="https://www.soundjay.com/buttons/button-3.mp3" preload="auto"></audio>
    <audio id="snd-miss" src="https://www.soundjay.com/buttons/beep-10.mp3" preload="auto"></audio>
    <audio id="snd-bg" src="" loop preload="auto"></audio>

    <script>
        window.IS_DESIGN_MODE = false;

        window.gameConfig = {
            eggTopY: 12,
            eggBottomY: 67,
            eggX: 73,
            eggFinalTopY: 27,
            eggFinalBottomY: 53,
            eggFinalX: 50,
            speed: 4000,
            timerMode: 'stopwatch',
            timer: 0, 
            qTimer: 60,
            teacher: true,
            teacherMode: true,
            qRandom: true,
            qRepeat: true,
            inGameInput: false,
            tasks: ["I ___ a happy boy.","The cat ___ black.","We ___ good friends.","I ___ sad today.","She ___ my sister.","They ___ at school.","___ I your friend?","___ he a doctor?","___ you ready to play?","I ___ a red ball.","He ___ a big dog.","We ___ any toys.","She ___ a blue pen.","My friends ___ a treehouse.","The monster ___ three eyes.","I ___ swim very fast.","The bird ___ fly high.","The pig ___ jump.","Fish ___ walk.","___ you ride a bike?"],
            correct: ["am","is","are","am not","isn't","aren't","Am","Is","Are","have got","has got","haven't got","hasn't got","have got","has got","can","can","can't","can't","Can"],
            wrong: ["has got, can","are, have got","is, can","isn't, haven't got","am not, hasn't got","isn't, can't","Is, Have","Are, Can","Is, Has","am, can","are, is","am not, can't","aren't, isn't","has got, is","have got, can","am, have got","is, has got","isn't, hasn't got","aren't, haven't got","Are, Have"],
            eggImg: 'https://i.imgur.com/71Cakxh.png',
            eggAngle: 50,
            wolfAmpX: 30,
            wolfAmpY: 20
        };

        const lblScore = "SCORE";
        const lblTime = "TIME";
        const lblMiss = "MISSES";

        function openIgTasks() {
            document.getElementById('screen-start').style.display = 'none';
            document.getElementById('screen-in-game-tasks').style.display = 'flex';
            const nl = String.fromCharCode(10);
            document.getElementById('ig-tasks').value = window.gameConfig.tasks.join(nl);
            document.getElementById('ig-correct').value = window.gameConfig.correct.join(nl);
            document.getElementById('ig-wrong').value = window.gameConfig.wrong.join(nl);
        }

        function saveIgTasks() {
            const nl = String.fromCharCode(10);
            const cr = String.fromCharCode(13);
            const t = document.getElementById('ig-tasks').value;
            const c = document.getElementById('ig-correct').value;
            const w = document.getElementById('ig-wrong').value;

            window.gameConfig.tasks = t.split(nl).map(x => x.replace(cr, '').trim()).filter(x => x !== '');
            window.gameConfig.correct = c.split(nl).map(x => x.replace(cr, '').trim()).filter(x => x !== '');
            window.gameConfig.wrong = w.split(nl).map(x => x.replace(cr, '').trim()).filter(x => x !== '');

            if (window.gameConfig.tasks.length > 0) {
                window.gameConfig.teacher = true;
                window.gameConfig.teacherMode = true;
            }

            document.getElementById('screen-in-game-tasks').style.display = 'none';
            document.getElementById('screen-start').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('screen-result').style.display = 'none';
            score = 0;
            misses = 0;
            timeSpent = 0;
            timeLeft = window.gameConfig.timerMode === 'countdown' ? window.gameConfig.timer : 0;
            
            document.getElementById('f-score').innerText = '0';
            document.getElementById('f-time').innerText = '0';
            document.getElementById('f-miss').innerText = '0';
            document.getElementById('score-val').innerText = score;
            document.getElementById('timer-val').innerText = timeLeft;
            
            document.getElementById('top-ui').style.display = 'none';
            document.getElementById('screen-start').style.display = 'flex';
        }

        let score = 0;
        let misses = 0;
        let timeSpent = 0;
        let timeLeft = window.gameConfig.timerMode === 'countdown' ? window.gameConfig.timer : 0;
        let gameRunning = false;
        let isPaused = false;
        let currentPos = 'bl';
        let eggSpeed = window.gameConfig.speed;
        let pointsPerEgg = 1;
        let mainTimerInterval, qTimerInterval, spawnTimeout, countdownTimer;
        
        let askedQuestions = [];
        let currentQuestionIndex = 0;
        let audioUnlocked = false;
        let synthAudioCtx = null;

        function getAudioCtx() {
            if (!synthAudioCtx) {
                synthAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (synthAudioCtx.state === 'suspended') {
                synthAudioCtx.resume();
            }
            return synthAudioCtx;
        }

        function playSynthSound(type) {
            try {
                const audioContext = getAudioCtx();
                if (type === 'catch') {
                    const times = [0, 0.1, 0.2];
                    const freqs = [523.25, 659.25, 783.99];
                    times.forEach((time, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freqs[i];
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.3, audioContext.currentTime + time);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + time + 0.4);
                        osc.start(audioContext.currentTime + time);
                        osc.stop(audioContext.currentTime + time + 0.4);
                    });
                } else if (type === 'break') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(500, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioContext.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.35, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.4);
                } else if (type === 'correct') {
                    const melody = [
                        { freq: 523.25, time: 0 },
                        { freq: 659.25, time: 0.15 },
                        { freq: 783.99, time: 0.3 },
                        { freq: 1046.50, time: 0.45 }
                    ];
                    melody.forEach(note => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = note.freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.32, audioContext.currentTime + note.time);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + note.time + 0.5);
                        osc.start(audioContext.currentTime + note.time);
                        osc.stop(audioContext.currentTime + note.time + 0.5);
                    });
                } else if (type === 'wrong') {
                    const notes = [
                        { freq: 392, time: 0 },
                        { freq: 349.23, time: 0.2 },
                        { freq: 293.66, time: 0.4 }
                    ];
                    notes.forEach(note => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.type = 'sine';
                        osc.frequency.value = note.freq;
                        gain.gain.setValueAtTime(0.25, audioContext.currentTime + note.time);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + note.time + 0.5);
                        osc.start(audioContext.currentTime + note.time);
                        osc.stop(audioContext.currentTime + note.time + 0.5);
                    });
                } else if (type === 'tick') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = 800;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.25, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.2);
                } else if (type === 'gameStart') {
                    const melody = [
                        { freq: 523.25, time: 0 },
                        { freq: 659.25, time: 0.12 },
                        { freq: 783.99, time: 0.24 },
                        { freq: 1046.50, time: 0.36 }
                    ];
                    melody.forEach(note => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = note.freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.28, audioContext.currentTime + note.time);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + note.time + 0.35);
                        osc.start(audioContext.currentTime + note.time);
                        osc.stop(audioContext.currentTime + note.time + 0.35);
                    });
                } else if (type === 'gameEnd') {
                    const melody = [
                        { freq: 1046.50, time: 0 },
                        { freq: 987.77, time: 0.12 },
                        { freq: 880.00, time: 0.24 },
                        { freq: 783.99, time: 0.36 },
                        { freq: 659.25, time: 0.48 },
                        { freq: 523.25, time: 0.6 }
                    ];
                    melody.forEach(note => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = note.freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.28, audioContext.currentTime + note.time);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + note.time + 0.45);
                        osc.start(audioContext.currentTime + note.time);
                        osc.stop(audioContext.currentTime + note.time + 0.45);
                    });
                }
            } catch (error) {
                console.log("AudioContext error:", error);
            }
        }

        document.body.addEventListener('click', () => {
            if(audioUnlocked) return;
            getAudioCtx();
            ['snd-success', 'snd-miss', 'snd-bg'].forEach(id => {
                let el = document.getElementById(id);
                if(el && el.src) {
                    el.play().then(() => {
                        if(id !== 'snd-bg' || !gameRunning) { el.pause(); el.currentTime = 0; }
                    }).catch(()=>{});
                }
            });
            audioUnlocked = true;
        }, { once: true });

        function playSound(id) {
            const snd = document.getElementById(id);
            if(snd && snd.src) {
                snd.currentTime = 0;
                let playPromise = snd.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => console.log("Audio prevented:", error));
                }
            }
        }

        function move(p) {
            currentPos = p;
            const s = document.getElementById('wolf-sprite');
            let ty = 0;
            
            if(p.includes('l')) { s.classList.add('mirror'); }
            else { s.classList.remove('mirror'); }
            
            if(p.includes('t')) ty = -window.gameConfig.wolfAmpY;
            else ty = window.gameConfig.wolfAmpY;

            const wolf = document.getElementById('wolf');
            wolf.style.transform = `translate(-50%, calc(-50% + ${ty}%))`;
        }

        function preStart(speed, pts) {
            eggSpeed = speed;
            pointsPerEgg = pts;
            document.getElementById('screen-start').style.display = 'none';
            document.getElementById('screen-countdown').style.display = 'flex';
            
            if(window.gameConfig.bgMusic) document.getElementById('snd-bg').play().catch(()=>{});
            
            let count = 3;
            const cd = document.getElementById('countdown');
            cd.style.display = 'block';
            cd.innerText = count;
            playSynthSound('tick');
            
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                count--;
                if(count > 0) {
                    cd.innerText = count;
                    playSynthSound('tick');
                } else {
                    clearInterval(countdownTimer);
                    startGame();
                }
            }, 1000);
        }

        function startGame() {
            document.getElementById('screen-countdown').style.display = 'none';
            document.getElementById('top-ui').style.display = 'flex';
            gameRunning = true;
            isPaused = false;
            
            playSynthSound('gameStart');
            
            askedQuestions = [];
            currentQuestionIndex = 0;

            mainTimerInterval = setInterval(() => {
                if(!gameRunning || isPaused) return;
                
                if (window.gameConfig.timerMode === 'countdown') {
                    timeLeft--;
                    timeSpent++;
                    document.getElementById('timer-val').innerText = timeLeft;
                    if(timeLeft <= 0) endGame();
                } else {
                    timeSpent++;
                    document.getElementById('timer-val').innerText = timeSpent;
                }
            }, 1000);
            spawnCycle();
        }

        function spawnCycle() {
            if(!gameRunning) return;
            if(!isPaused) spawn();
            spawnTimeout = setTimeout(spawnCycle, eggSpeed * 0.85);
        }

        function spawn() {
            const conf = window.gameConfig;
            const egg = document.createElement('img');
            egg.src = conf.eggImg;
            egg.className = 'egg';
            
            const isTop = Math.random() > 0.5;
            const isLeft = Math.random() > 0.5;
            const side = (isTop ? 't' : 'b') + (isLeft ? 'l' : 'r');

            egg.style.top = isTop ? conf.eggTopY+'%' : conf.eggBottomY+'%';
            if(isLeft) egg.style.left = conf.eggX + '%';
            else egg.style.right = conf.eggX + '%';
            
            document.getElementById('game-area').appendChild(egg);

            setTimeout(() => {
                egg.style.transition = 'all ' + (eggSpeed/1000) + 's linear';
                egg.style.top = isTop ? conf.eggFinalTopY + '%' : conf.eggFinalBottomY + '%';
                if(isLeft) egg.style.left = conf.eggFinalX + '%';
                else egg.style.right = conf.eggFinalX + '%';
                egg.style.transform = 'rotate(' + (parseInt(conf.eggAngle) + 360) + 'deg)';
            }, 50);

            setTimeout(() => {
                if(currentPos === side && gameRunning && !isPaused) {
                    handleCatch();
                } else if (gameRunning && !isPaused) {
                    showMiss();
                }
                if(egg.parentNode) egg.remove();
            }, eggSpeed);
        }

        function showMiss() {
            misses++;
            const ms = document.getElementById('miss-sign');
            if(ms) ms.style.display = 'block';
            playSound('snd-miss');
            playSynthSound('break');
            setTimeout(() => { if(ms) ms.style.display = 'none'; }, 500);
        }

        function handleCatch() {
            const conf = window.gameConfig;
            playSynthSound('catch');
            
            if((conf.teacher || conf.teacherMode) && conf.tasks && conf.tasks.length > 0) {
                showQuestionModal();
            } else {
                score += pointsPerEgg;
                document.getElementById('score-val').innerText = score;
                playSound('snd-success');
            }
        }

        function showQuestionModal() {
            isPaused = true;
            const c = window.gameConfig;
            
            let availableTasks = [];
            for (let i = 0; i < c.tasks.length; i++) {
                if (c.qRepeat || !askedQuestions.includes(i)) {
                    availableTasks.push(i);
                }
            }

            if (availableTasks.length === 0) {
                score += pointsPerEgg;
                document.getElementById('score-val').innerText = score;
                playSound('snd-success');
                isPaused = false;
                return;
            }

            let idx;
            if (c.qRandom) {
                idx = availableTasks[Math.floor(Math.random() * availableTasks.length)];
            } else {
                if (!c.qRepeat) {
                    idx = availableTasks[0];
                } else {
                    idx = currentQuestionIndex % c.tasks.length;
                    currentQuestionIndex++;
                }
            }

            if (!c.qRepeat) {
                askedQuestions.push(idx);
            }
            
            document.getElementById('q-text').innerText = c.tasks[idx] || 'Вопрос?';
            const modal = document.getElementById('q-modal');
            modal.style.display = 'flex';
            
            const correctAns = c.correct[idx] || '';
            const wrongAnsArr = (c.wrong[idx] || '').split(',').map(x => x.trim()).filter(x => x !== '');
            const btns = [correctAns, ...wrongAnsArr].filter(Boolean);

            btns.sort(() => Math.random() - 0.5); 
            
            const container = document.getElementById('answers');
            container.innerHTML = '';

            btns.forEach(a => {
                const b = document.createElement('button');
                b.className = 'ans-btn';
                b.innerText = a;
                b.onclick = () => {
                    clearInterval(qTimerInterval);
                    if(a === correctAns) {
                        score += pointsPerEgg;
                        document.getElementById('score-val').innerText = score;
                        playSound('snd-success');
                        playSynthSound('correct');
                        closeQuestionAndResume();
                    } else {
                        misses++;
                        playSound('snd-miss');
                        playSynthSound('wrong');
                        closeQuestionAndResume();
                    }
                };
                container.appendChild(b);
            });

            let qTimeLeft = c.qTimer;
            document.getElementById('q-timer-display').innerText = qTimeLeft;
            qTimerInterval = setInterval(() => {
                qTimeLeft--;
                document.getElementById('q-timer-display').innerText = qTimeLeft;
                if(qTimeLeft <= 3 && qTimeLeft > 0) playSynthSound('tick');
                
                if(qTimeLeft <= 0) {
                    misses++;
                    playSound('snd-miss');
                    playSynthSound('wrong');
                    clearInterval(qTimerInterval);
                    closeQuestionAndResume(); 
                }
            }, 1000);
        }

        function closeQuestionAndResume() {
            document.getElementById('q-modal').style.display = 'none';
            setTimeout(() => { isPaused = false; }, 500);
        }

        function stopGameEarly() {
            if(!window.IS_DESIGN_MODE) {
                endGame();
            }
        }

        function endGame() {
            gameRunning = false;
            isPaused = true;
            clearInterval(mainTimerInterval);
            clearInterval(qTimerInterval);
            clearInterval(countdownTimer);
            clearTimeout(spawnTimeout);
            
            playSynthSound('gameEnd');
            
            const bgSnd = document.getElementById('snd-bg');
            if(bgSnd && bgSnd.src) { bgSnd.pause(); bgSnd.currentTime = 0; }
            
            const eggs = document.querySelectorAll('.egg');
            eggs.forEach(e => e.remove());
            
            document.getElementById('screen-start').style.display = 'none';
            document.getElementById('screen-countdown').style.display = 'none';
            document.getElementById('q-modal').style.display = 'none';
            document.getElementById('screen-result').style.display = 'flex';
            
            document.getElementById('f-score').innerText = score;
            document.getElementById('f-time').innerText = timeSpent;
            document.getElementById('f-miss').innerText = misses;

            // Generate QR Code with results
            const qrDataText = `${lblScore}: ${score} | ${lblMiss}: ${misses} | ${lblTime}: ${timeSpent}s`;
            const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=10&data=" + encodeURIComponent(qrDataText);
            document.getElementById('qr-code-img').src = qrUrl;
        }

        function stopGame() {
            gameRunning = false;
            isPaused = true;
            clearInterval(mainTimerInterval);
            clearInterval(qTimerInterval);
            clearInterval(countdownTimer);
            clearTimeout(spawnTimeout);
            
            if (!window.IS_DESIGN_MODE) {
                document.getElementById('screen-start').style.display = 'flex';
            }
            
            document.getElementById('screen-countdown').style.display = 'none';
            document.getElementById('q-modal').style.display = 'none';
            
            const eggs = document.querySelectorAll('.egg');
            eggs.forEach(e => e.remove());
        }
    </script>
</body>
</html>
